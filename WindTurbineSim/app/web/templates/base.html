<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}WindTurbineSim{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', path='/css/main.css') }}"
    />

    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="app-root">
      <header class="topbar">
        <div class="topbar-left">
          <span class="logo-dot"></span>
          <span class="topbar-title">WindTurbineSim</span>
        </div>
        <div class="topbar-right">
          <a href="/" class="topbar-link">API root</a>
          <a href="/docs" class="topbar-link">API docs</a>
        </div>
      </header>

      <main class="main-content">
        {% block content %}{% endblock %}
      </main>

      <footer class="footer">
        <span>WindTurbineSim – OpenSearch streaming &amp; attack demo</span>
      </footer>
    </div>

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
